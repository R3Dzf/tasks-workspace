<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamified Workspace Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { 
            background: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.3); 
        }
        body { 
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); 
            min-height: 100vh; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        /* CSS to fix text overflow */
        .break-words { 
            word-break: break-all; 
            overflow-wrap: break-word; 
        }
        /* Shake animation for Nudge */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shake {
            animation: shake 0.5s;
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <!-- Navbar -->
    <div class="max-w-6xl mx-auto space-y-6">
        <div class="glass p-4 rounded-xl shadow-lg flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800">TaskSync Workspace</h1>
            <div class="flex gap-3">
                <button class="bg-white/50 px-4 py-2 rounded-lg hover:bg-white/80 transition text-sm font-bold shadow-sm">📅 View History</button>
                <button class="bg-red-400 text-white px-4 py-2 rounded-lg hover:bg-red-500 transition text-sm font-bold shadow-sm">Logout</button>
            </div>
        </div>
        
        <!-- Dual Timers Section -->
        <div class="glass p-6 rounded-xl shadow-lg text-center relative overflow-hidden">
            <h2 class="text-xl font-bold mb-4 text-gray-800">Focus Timer</h2>
            <div class="flex justify-center gap-4 mb-4">
                <button class="bg-blue-500 text-white px-6 py-2 rounded-full hover:bg-blue-600 transition shadow-md">Solo Focus</button>
                <button class="bg-purple-500 text-white px-6 py-2 rounded-full hover:bg-purple-600 transition shadow-md">Study With Me</button>
            </div>
            <div class="text-5xl font-mono font-bold text-gray-800 my-4">25:00</div>
            <p class="text-sm text-gray-600 mb-4 font-bold">Total Focus Time: <span class="text-blue-600">2 Hrs 15 Mins</span></p>
            <button class="bg-green-500 text-white px-10 py-3 rounded-xl font-bold hover:bg-green-600 transition shadow-md text-lg">Start</button>
        </div>

        <!-- Workspaces (Mobile Responsive Grid) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- My Workspace -->
            <div class="glass p-6 rounded-xl shadow-lg">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-gray-800">My Workspace <span title="High Score">👑</span><span title="3 Days Streak">🔥</span></h2>
                    <span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-bold shadow-sm">Score: 120 pts</span>
                </div>
                <!-- Input Area -->
                <div class="flex gap-2 mb-4">
                    <input id="taskInput" type="text" placeholder="What needs to be done?..." class="flex-1 p-3 rounded-lg border-0 shadow-inner focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white/70">
                </div>
                <div class="flex gap-2 mb-4">
                    <button id="addMeBtn" class="flex-1 bg-gray-800 text-white p-2 rounded-lg hover:bg-gray-900 transition shadow-md font-bold text-sm">+ Add to Me (10p)</button>
                    <button id="addBountyBtn" class="flex-1 bg-yellow-500 text-white p-2 rounded-lg hover:bg-yellow-600 transition shadow-md font-bold text-sm">🎯 Send Bounty (50p)</button>
                </div>
                <!-- My Tasks List -->
                <div id="myTasksList" class="space-y-3">
                    <!-- Tasks will load here automatically -->
                </div>
            </div>

            <!-- Peer Workspace -->
            <div class="glass p-6 rounded-xl shadow-lg">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-gray-800">Peer Workspace</h2>
                    <div class="flex items-center gap-2">
                        <button class="bg-red-100 text-red-600 px-3 py-1 rounded-full text-sm font-bold shadow-sm hover:bg-red-200 transition" title="Nudge Peer">🔔 Nudge</button>
                        <span class="bg-purple-100 text-purple-800 px-3 py-1 rounded-full text-sm font-bold shadow-sm">Score: 90 pts</span>
                    </div>
                </div>
                <!-- Peer Tasks List -->
                <div id="peerTasksList" class="space-y-3">
                     <!-- Peer tasks will load here automatically -->
                </div>
            </div>
            
        </div>
    </div>
    
    <!-- Scripts & Firebase setup instructions -->
    <script type="module">
        // 1. استدعاء Firebase عبر الروابط الصحيحة للمواقع الثابتة
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

        // إعدادات مشروعك
        const firebaseConfig = {
            apiKey: "AIzaSyA3oQpYm4NLM74D4ETEGSqLrDm4UomkAM4",
            authDomain: "study-workspace-93908.firebaseapp.com",
            projectId: "study-workspace-93908",
            storageBucket: "study-workspace-93908.firebasestorage.app",
            messagingSenderId: "206893022313",
            appId: "1:206893022313:web:c1f4d1589d9f8eddba76f8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const tasksRef = ref(db, 'tasks');

        // إنشاء ID فريد لكل مستخدم لتمييز جهازه
        let myId = localStorage.getItem('userId');
        if (!myId) {
            myId = 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('userId', myId);
        }

        // تشغيل المؤقت (Timer)
        let timerInterval;
        let timeLeft = 25 * 60;
        const timerDisplay = document.querySelector('.text-5xl');
        const startBtn = document.querySelector('.bg-green-500');

        startBtn.addEventListener('click', () => {
            if(startBtn.innerText === 'Start') {
                startBtn.innerText = 'Pause';
                startBtn.classList.replace('bg-green-500', 'bg-yellow-500');
                timerInterval = setInterval(() => {
                    timeLeft--;
                    let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
                    let s = (timeLeft % 60).toString().padStart(2, '0');
                    timerDisplay.innerText = `${m}:${s}`;
                    if(timeLeft <= 0) clearInterval(timerInterval);
                }, 1000);
            } else {
                startBtn.innerText = 'Start';
                startBtn.classList.replace('bg-yellow-500', 'bg-green-500');
                clearInterval(timerInterval);
            }
        });

        // تعريف أماكن إدخال وعرض المهام
        const taskInput = document.getElementById('taskInput');
        const addMeBtn = document.getElementById('addMeBtn');
        const addBountyBtn = document.getElementById('addBountyBtn');
        const myTasksList = document.getElementById('myTasksList');
        const peerTasksList = document.getElementById('peerTasksList');

        // إضافة مهمة عادية لنفسي
        addMeBtn.addEventListener('click', () => {
            if(!taskInput.value.trim()) return;
            push(tasksRef, {
                text: taskInput.value,
                sender: myId,
                type: 'normal',
                timestamp: Date.now()
            });
            taskInput.value = '';
        });

        // إضافة مهمة كـ "تحدي / Bounty" للطرف التاني
        addBountyBtn.addEventListener('click', () => {
            if(!taskInput.value.trim()) return;
            push(tasksRef, {
                text: taskInput.value,
                sender: myId,
                type: 'bounty',
                timestamp: Date.now()
            });
            taskInput.value = '';
        });

        // قراءة المهام لحظياً من قاعدة البيانات وتوزيعها على الشاشتين
        onValue(tasksRef, (snapshot) => {
            myTasksList.innerHTML = '';
            peerTasksList.innerHTML = '';
            
            const tasksArray = [];
            snapshot.forEach((childSnapshot) => {
                tasksArray.push(childSnapshot.val());
            });

            // ترتيب المهام من الأحدث للأقدم
            tasksArray.sort((a, b) => b.timestamp - a.timestamp);

            tasksArray.forEach((task) => {
                let taskHtml = '';
                
                if(task.type === 'bounty') {
                    // شكل المهمة التحدي (Bounty)
                    taskHtml = `
                        <div class="bg-white/80 p-3 rounded-lg flex items-start gap-3 shadow-sm border-r-4 border-yellow-400 mb-2">
                            <input type="checkbox" class="w-5 h-5 mt-1 cursor-pointer accent-purple-500">
                            <span class="flex-1 text-gray-800 font-semibold break-words">🎯 Bounty: ${task.text}</span>
                            <span class="text-xs font-bold text-yellow-600">+50p</span>
                        </div>
                    `;
                } else {
                    // شكل المهمة العادية
                    taskHtml = `
                        <div class="bg-white/80 p-3 rounded-lg flex items-start gap-3 shadow-sm mb-2">
                            <input type="checkbox" class="w-5 h-5 mt-1 cursor-pointer accent-blue-500">
                            <span class="flex-1 text-gray-800 font-semibold break-words">${task.text}</span>
                            <span class="text-xs font-bold text-blue-500">+10p</span>
                        </div>
                    `;
                }
                
                // توزيع المهام بيني وبين شاشة زميلي بناءً على نوع المهمة ومين اللي بعتها
                if (task.sender === myId) {
                    if (task.type === 'bounty') {
                        peerTasksList.innerHTML += taskHtml; 
                    } else {
                        myTasksList.innerHTML += taskHtml; 
                    }
                } else {
                    if (task.type === 'bounty') {
                        myTasksList.innerHTML += taskHtml; 
                    } else {
                        peerTasksList.innerHTML += taskHtml;
                    }
                }
            });
        });
    </script>
</body>
</html>
